server:
  port: 8086

spring:
  application:
    name: observability-stack-demo

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  distribution:
    percentiles-histogram:
      http.server.requests: true
    sla:
      http.server.requests: 50ms,100ms,200ms,500ms
